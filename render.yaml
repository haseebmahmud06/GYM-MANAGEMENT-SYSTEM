# Render Blueprint — one-click deploy for Fitness First Gym
# Backend (Django + PostgreSQL) web service.
# If you deploy the React frontend too, add a second "static site" entry
# pointing at the FEG/ directory (see comment at the bottom).
databases:
  - name: fitness-first-gym-db
    plan: free
    databaseName: fitness_first_gym
    user: fitness_first_gym

services:
  - type: web
    name: fitness-first-gym-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: "gunicorn fitness_first_gym.wsgi --log-file -"
    healthCheckPath: /api/packages/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-first-gym-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: 2

# Optional: deploy the React frontend as a Static Site on Render.
